name: Daily Briefing

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行每日晨报
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py briefing

      - name: 提交生成的选题
        run: |
          git config user.name "MCP Radar Bot"
          git config user.email "bot@mc-prime.com"
          git add output/topics_*.json output/last_update_id.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Daily topics $(date -u +%Y-%m-%d)"
          git push
